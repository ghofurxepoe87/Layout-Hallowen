<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Infinity Sky Lounge 3D - Platinum Hotel Balikpapan</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e293b 0%, #111827 60%, #0b0f17 100%);
      --gold-primary: #d4af37;
      --gold-bright: #fef08a;
      --gold-grad: linear-gradient(135deg, #fce08a 0%, #d4af37 50%, #856108 100%);
      --gold-glow: rgba(212, 175, 55, 0.45);
      
      --color-avail-desk: #1e293b;
      --color-avail-border: #38bdf8;
      
      --color-booked-main: #dc2626;
      --color-booked-dark: #7f1d1d;
      --color-booked-glow: rgba(220, 38, 38, 0.85);

      --card-bg: rgba(23, 31, 48, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER ULTRA LUXURY */
    header {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding: 12px 18px;
      position: sticky;
      top: 0;
      z-index: 60;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .header-wrap {
      max-width: 1500px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-frame {
      width: 58px;
      height: 58px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--gold-primary);
      border-radius: 12px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--gold-glow);
      position: relative;
      overflow: hidden;
    }

    .brand-logo-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .brand-logo-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      color: var(--gold-primary);
      font-size: 1.3rem;
    }

    .brand-text h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: #94a3b8;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .event-badge {
      background: rgba(236, 72, 153, 0.2);
      border: 1px solid #ec4899;
      color: #f472b6;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    /* STATS HEADER */
    .header-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill i { font-size: 0.95rem; }
    .stat-pill .info { display: flex; flex-direction: column; line-height: 1.1; }
    .stat-pill .info span { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }
    .stat-pill .info strong { font-size: 0.85rem; }

    .btn-gold {
      background: var(--gold-grad);
      color: #111;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
    }

    /* MOBILE / VIEWPORT CONTROLS */
    .view-toolbar {
      max-width: 1500px;
      margin: 10px auto 0;
      padding: 0 16px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .legend-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.avail { background: #38bdf8; box-shadow: 0 0 6px #38bdf8; }
    .dot.booked { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-zoom {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #fff;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 3D SCENE CONTAINER */
    .scene-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      perspective: 1200px;
    }

    .scene-canvas {
      width: 100%;
      max-width: 1250px;
      transform-style: preserve-3d;
      transform: rotateX(24deg) rotateZ(0deg) scale(0.95);
      transition: transform 0.25s ease-out;
      transform-origin: center center;
    }

    /* 3D BLUEPRINT SVG */
    svg.blueprint-3d {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.6));
    }

    /* INTERAKTIF MEJA & SOFA */
    .tbl-node {
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tbl-node:hover {
      filter: drop-shadow(0 0 10px rgba(254, 240, 138, 0.9));
    }

    /* STATUS TERSEDIA */
    .tbl-node.is-avail .t-chair {
      fill: #1e293b;
      stroke: #64748b;
      stroke-width: 1.5;
    }
    .tbl-node.is-avail .t-desk {
      fill: #0f172a;
      stroke: var(--color-avail-border);
      stroke-width: 2;
    }
    .tbl-node.is-avail text {
      fill: #f8fafc;
      font-weight: 700;
    }

    /* STATUS TERBOOKING -> MERAH MENYALA BESERTA SELURUH SOFA & KURSI */
    .tbl-node.is-booked .t-chair {
      fill: var(--color-booked-dark) !important;
      stroke: var(--color-booked-main) !important;
      stroke-width: 2 !important;
      filter: drop-shadow(0 0 6px var(--color-booked-glow));
    }
    .tbl-node.is-booked .t-desk {
      fill: #991b1b !important;
      stroke: #f87171 !important;
      stroke-width: 2.5 !important;
      filter: drop-shadow(0 0 8px var(--color-booked-glow));
    }
    .tbl-node.is-booked text {
      fill: #ffffff !important;
      font-weight: 800 !important;
    }

    /* MODAL POPUP FORM (OPTIMIZED FOR ANDROID & IOS) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 23, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }

    .modal-head {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-head h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      color: var(--gold-bright);
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-item label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      -webkit-appearance: none;
    }

    .input-box:focus {
      border-color: var(--gold-primary);
    }

    .currency-wrap {
      position: relative;
    }

    .currency-wrap span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .currency-wrap input {
      padding-left: 42px;
      width: 100%;
    }

    .modal-actions {
      padding: 14px 18px;
      background: #0f172a;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-delete-bk {
      background: #7f1d1d;
      color: #fca5a5;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-confirm-bk {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <!-- HEADER MEWAH -->
  <header>
    <div class="header-wrap">
      <div class="brand-section">
        <div class="brand-logo-frame">
          <img id="mainLogo" src="logo.png" alt="Platinum Hotel Logo" 
               onerror="this.onerror=null; this.src='logo platinum hotel Balikpapan.png'; this.addEventListener('error', showLogoFallback);">
          <div id="fallbackLogo" class="brand-logo-fallback">
            <i class="fa-solid fa-crown"></i>
          </div>
        </div>
        <div class="brand-text">
          <h1>Platinum Hotel & Convention Hall</h1>
          <p>
            <span>INFINITY SKY LOUNGE</span>
            <span class="event-badge"><i class="fa-solid fa-ghost"></i> HALLOWEEN 2026</span>
          </p>
        </div>
      </div>

      <div class="header-stats">
        <div class="stat-pill">
          <i class="fa-solid fa-couch" style="color: var(--gold-primary);"></i>
          <div class="info">
            <span>Status</span>
            <strong><span id="txtBooked" style="color: #ef4444;">0</span> / <span id="txtTotal">35</span> Booked</strong>
          </div>
        </div>

        <div class="stat-pill">
          <i class="fa-solid fa-money-bill-wave" style="color: #34d399;"></i>
          <div class="info">
            <span>Total DP</span>
            <strong id="txtTotalDP" style="color: #34d399;">Rp 0</strong>
          </div>
        </div>

        <button class="btn-gold" onclick="downloadCSVReport()">
          <i class="fa-solid fa-file-csv"></i> Unduh CSV
        </button>
      </div>
    </div>
  </header>

  <!-- CONTROLS & LEGENDA -->
  <div class="view-toolbar">
    <div class="legend-box">
      <div style="display:flex; align-items:center; gap:6px;"><div class="dot avail"></div> Tersedia</div>
      <div style="display:flex; align-items:center; gap:6px;"><div class="dot booked"></div> Terbooking (Merah)</div>
    </div>
    <div class="zoom-controls">
      <button class="btn-zoom" onclick="adjustPerspective(-5)"><i class="fa-solid fa-rotate-left"></i></button>
      <button class="btn-zoom" onclick="adjustPerspective(5)"><i class="fa-solid fa-rotate-right"></i></button>
      <button class="btn-zoom" onclick="scaleScene(0.1)"><i class="fa-solid fa-plus"></i></button>
      <button class="btn-zoom" onclick="scaleScene(-0.1)"><i class="fa-solid fa-minus"></i></button>
      <button class="btn-zoom" onclick="resetScene()"><i class="fa-solid fa-arrows-rotate"></i></button>
    </div>
  </div>

  <!-- PERSPEKTIF DENAH ISOMETRIK 3D SESUAI ASLI -->
  <div class="scene-viewport" id="viewportTouchArea">
    <div class="scene-canvas" id="sceneContainer">
      <svg class="blueprint-3d" viewBox="0 0 1200 1150" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Efek 3D Ambient & Drop Shadow -->
          <filter id="shadowDepth" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
          </filter>
          <linearGradient id="deckWood" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2d3748" />
            <stop offset="100%" stop-color="#1e293b" />
          </linearGradient>
          <linearGradient id="mainFloor" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#232d3f" />
            <stop offset="100%" stop-color="#18202f" />
          </linearGradient>
          <linearGradient id="djBeam" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
            <stop offset="100%" stop-color="rgba(168, 85, 247, 0)" />
          </linearGradient>
        </defs>

        <!-- LANTAI UTAMA SLATE MEWAH -->
        <polygon points="40,240 500,240 500,40 1160,40 1160,550 630,550 630,1110 40,1110" fill="url(#mainFloor)" stroke="#475569" stroke-width="2.5" />

        <!-- UPPER SKY FLOOR (TERANGKAT 3D) -->
        <rect x="520" y="55" width="620" height="240" fill="url(#deckWood)" rx="8" stroke="#d4af37" stroke-width="1.2" filter="url(#shadowDepth)" />

        <!-- Tangga & Photobox -->
        <rect x="990" y="65" width="40" height="150" fill="#334155" stroke="#64748b" />
        <line x1="990" y1="85" x2="1030" y2="85" stroke="#94a3b8" stroke-width="2" />
        <line x1="990" y1="105" x2="1030" y2="105" stroke="#94a3b8" stroke-width="2" />
        <line x1="990" y1="125" x2="1030" y2="125" stroke="#94a3b8" stroke-width="2" />
        <line x1="990" y1="145" x2="1030" y2="145" stroke="#94a3b8" stroke-width="2" />
        <line x1="990" y1="165" x2="1030" y2="165" stroke="#94a3b8" stroke-width="2" />
        <line x1="990" y1="185" x2="1030" y2="185" stroke="#94a3b8" stroke-width="2" />

        <text x="1050" y="100" fill="#cbd5e1" font-size="14" font-weight="700" font-style="italic">Sky Floor</text>
        <rect x="1045" y="150" width="95" height="48" fill="#ec4899" rx="4" filter="url(#shadowDepth)" />
        <text x="1092" y="178" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">photobox</text>

        <!-- Akses Pintu & Restroom -->
        <text x="540" y="225" fill="#38bdf8" font-size="11" font-weight="700">IN | OUT</text>
        <text x="520" y="240" fill="#94a3b8" font-size="9">LIFT ACCES FROM 10TH FLOOR</text>

        <rect x="655" y="210" width="55" height="25" fill="#1e293b" stroke="#64748b" rx="2" />
        <text x="682" y="225" fill="#cbd5e1" font-size="8" font-weight="700" text-anchor="middle">RESTROOM</text>

        <text x="1045" y="225" fill="#38bdf8" font-size="11" font-weight="700">IN | OUT</text>
        <text x="1030" y="240" fill="#94a3b8" font-size="9">ACCES FROM ROOFTOP TERACE</text>

        <!-- PANGGUNG DJ DENGAN LIGHTING BEAM 3D -->
        <g id="dj_stage" transform="translate(180, 260)" filter="url(#shadowDepth)">
          <!-- Efek Beam Sorot Cahaya -->
          <polygon points="20,60 -60,280 100,280" fill="url(#djBeam)" opacity="0.4" />
          <polygon points="20,60 140,280 280,280" fill="url(#djBeam)" opacity="0.4" />

          <!-- Panggung & Rig -->
          <rect x="-80" y="0" width="200" height="125" fill="#1e293b" stroke="#d4af37" stroke-width="1.5" rx="6" />
          <rect x="-40" y="75" width="120" height="42" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="3" />
          <circle cx="20" cy="55" r="14" fill="#f59e0b" filter="url(#shadowDepth)" />
          <text x="20" y="102" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle">DJ BOOTH</text>

          <!-- Rig Lighting -->
          <circle cx="-135" cy="50" r="18" fill="#0f172a" stroke="#d4af37" stroke-width="2"/>
          <line x1="-135" y1="68" x2="-160" y2="135" stroke="#d4af37" stroke-width="2" />
          <line x1="-135" y1="68" x2="-110" y2="135" stroke="#d4af37" stroke-width="2" />
          <circle cx="175" cy="50" r="18" fill="#0f172a" stroke="#d4af37" stroke-width="2"/>
          <line x1="175" y1="68" x2="150" y2="135" stroke="#d4af37" stroke-width="2" />
          <line x1="175" y1="68" x2="200" y2="135" stroke="#d4af37" stroke-width="2" />
        </g>

        <!-- BAR STATION -->
        <g id="bar_station" transform="translate(535, 450)" filter="url(#shadowDepth)">
          <rect x="0" y="0" width="85" height="18" fill="#ec4899" rx="3" />
          <rect x="0" y="18" width="85" height="125" fill="#7c3aed" rx="4" />
          <text x="42" y="85" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">BAR STATION</text>
        </g>

        <!-- TEKS ELEGAN LANTAI -->
        <g transform="translate(650, 560)">
          <text x="0" y="30" fill="#f1f5f9" font-family="'Cinzel', serif" font-size="28" font-weight="800" letter-spacing="2">INFINITY</text>
          <text x="0" y="65" fill="#f1f5f9" font-family="'Cinzel', serif" font-size="28" font-weight="800" letter-spacing="2">SKY LOUNGE</text>
          <text x="12" y="210" fill="#e2e8f0" font-size="24" font-weight="600">Layout HALLOWEN</text>
          <text x="12" y="245" fill="#cbd5e1" font-size="24" font-weight="500">30 October 2026</text>
        </g>

        <!-- ================= DAFTAR MEJA & SOFA LENGKAP ================= -->

        <!-- DINING TABLE ATAS 8 KURSI: 123, 122, 121, 120 -->
        <g id="tbl-123" class="tbl-node is-avail" onclick="openModal('123', 'Dining Table 8-Pax', 8)" transform="translate(585, 70)" filter="url(#shadowDepth)">
          <rect class="t-chair" x="-8" y="10" width="8" height="12" rx="2" /><rect class="t-chair" x="-8" y="32" width="8" height="12" rx="2" />
          <rect class="t-chair" x="52" y="10" width="8" height="12" rx="2" /><rect class="t-chair" x="52" y="32" width="8" height="12" rx="2" />
          <rect class="t-chair" x="8" y="-8" width="12" height="8" rx="2" /><rect class="t-chair" x="32" y="-8" width="12" height="8" rx="2" />
          <rect class="t-chair" x="8" y="54" width="12" height="8" rx="2" /><rect class="t-chair" x="32" y="54" width="12" height="8" rx="2" />
          <rect class="t-desk" x="0" y="0" width="52" height="54" rx="4" />
          <text x="26" y="32" font-size="13" text-anchor="middle">123</text>
        </g>

        <g id="tbl-122" class="tbl-node is-avail" onclick="openModal('122', 'Dining Table 8-Pax', 8)" transform="translate(675, 70)" filter="url(#shadowDepth)">
          <rect class="t-chair" x="-8" y="10" width="8" height="12" rx="2" /><rect class="t-chair" x="-8" y="32" width="8" height="12" rx="2" />
          <rect class="t-chair" x="52" y="10" width="8" height="12" rx="2" /><rect class="t-chair" x="52" y="32" width="8" height="12" rx="2" />
          <rect class="t-chair" x="8" y="-8" width="12" height="8" rx="2" /><rect class="t-chair" x="32" y="-8" width="12" height="8" rx="2" />
          <rect class="t-chair" x="8" y="54" width="12" height="8" rx="2" /><rect class="t-chair" x="32" y="54" width="12" height="8" rx="2" />
          <rect class="t-desk" x="0" y="0" width="52" height="54" rx="4" />
          <text x="26" y="32" font-size="13" text-anchor="middle">122</text>

  <!-- POPUP FORM RESERVASI / BOOKING & DP MANUAL -->
  <div id="bookingModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-head">
        <h3><i class="fa-solid fa-chair" style="color: var(--gold-bright);"></i> Reservasi <span id="lblTableNum">#101</span></h3>
        <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-content">
        <div class="form-item">
          <label><i class="fa-solid fa-user"></i> Nama Tamu (Guest Name) *</label>
          <input type="text" id="inName" class="input-box" placeholder="Contoh: Jessica Alexandra">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-item">
            <label><i class="fa-brands fa-whatsapp"></i> No. WA / HP *</label>
            <input type="tel" id="inPhone" class="input-box" placeholder="0812-xxxx-xxxx">
          </div>
          <div class="form-item">
            <label><i class="fa-solid fa-users"></i> Jumlah Pax</label>
            <input type="number" id="inPax" class="input-box" value="6" min="1">
          </div>
        </div>

        <!-- KOLOM INPUT MANUAL DP RUPIAH -->
        <div class="form-item">
          <label><i class="fa-solid fa-money-bill-wave" style="color: #34d399;"></i> Nominal DP / Uang Muka (Manual) *</label>
          <div class="currency-wrap">
            <span>Rp</span>
            <input type="text" id="inDP" class="input-box" placeholder="Contoh: 500.000" onkeyup="maskCurrency(this)">
          </div>
        </div>

        <div class="form-item">
          <label><i class="fa-solid fa-clock"></i> Jam Kedatangan</label>
          <select id="inTime" class="input-box">
            <option value="20:00 WITA">20:00 WITA (Gate Opening)</option>
            <option value="21:00 WITA" selected>21:00 WITA (Main DJ Set)</option>
            <option value="22:00 WITA">22:00 WITA (Midnight Bash)</option>
          </select>
        </div>

        <div class="form-item">
          <label><i class="fa-solid fa-note-sticky"></i> Catatan Khusus / Special Request</label>
          <input type="text" id="inNotes" class="input-box" placeholder="Cth: Request bucket ice, fruit platter...">
        </div>
      </div>

      <div class="modal-actions">
        <button id="btnCancelBook" class="btn-delete-bk" onclick="deleteCurrentBook()" style="display:none;">
          <i class="fa-solid fa-trash"></i> Hapus Reservasi
        </button>
        <button class="btn-delete-bk" style="background:#334155; color:#cbd5e1;" onclick="closeModal()">Tutup</button>
        <button class="btn-confirm-bk" onclick="saveCurrentBook()">
          <i class="fa-solid fa-check"></i> Simpan (Ubah ke Merah)
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'infinity_halloween_2026_bookings';
    let bookings = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    let currentTable = null;

    let rotX = 24;
    let currentScale = 0.95;

    window.addEventListener('DOMContentLoaded', () => {
      refreshVisuals();
      recalcTotals();
      initTouchGestures();
    });

    function showLogoFallback() {
      const img = document.getElementById('mainLogo');
      const fallback = document.getElementById('fallbackLogo');
      if (img) img.style.display = 'none';
      if (fallback) fallback.style.display = 'flex';
    }

    // Modal Handlers
    function openModal(num, label, defPax) {
      currentTable = num;
      document.getElementById('lblTableNum').innerText = '#' + num + ' (' + label + ')';
      
      const data = bookings[num];
      const btnDel = document.getElementById('btnCancelBook');

      if (data) {
        document.getElementById('inName').value = data.name || '';
        document.getElementById('inPhone').value = data.phone || '';
        document.getElementById('inPax').value = data.pax || defPax;
        document.getElementById('inDP').value = data.dp ? parseInt(data.dp, 10).toLocaleString('id-ID') : '';
        document.getElementById('inTime').value = data.time || '21:00 WITA';
        document.getElementById('inNotes').value = data.notes || '';
        btnDel.style.display = 'inline-flex';
      } else {
        document.getElementById('inName').value = '';
        document.getElementById('inPhone').value = '';
        document.getElementById('inPax').value = defPax;
        document.getElementById('inDP').value = '';
        document.getElementById('inTime').value = '21:00 WITA';
        document.getElementById('inNotes').value = '';
        btnDel.style.display = 'none';
      }

      document.getElementById('bookingModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('bookingModal').classList.remove('open');
      currentTable = null;
    }

    function maskCurrency(el) {
      let val = el.value.replace(/[^0-9]/g, '');
      el.value = val ? parseInt(val, 10).toLocaleString('id-ID') : '';
    }

    function saveCurrentBook() {
      const name = document.getElementById('inName').value.trim();
      const phone = document.getElementById('inPhone').value.trim();
      const rawDP = document.getElementById('inDP').value.replace(/[^0-9]/g, '');

      if (!name) {
        alert('Silakan masukkan nama pemesan tamu.');
        return;
      }

      bookings[currentTable] = {
        name: name,
        phone: phone,
        pax: document.getElementById('inPax').value,
        dp: rawDP ? parseInt(rawDP, 10) : 0,
        time: document.getElementById('inTime').value,
        notes: document.getElementById('inNotes').value,
        timestamp: new Date().toISOString()
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
      refreshVisuals();
      recalcTotals();
      closeModal();
    }

    function deleteCurrentBook() {
      if (confirm('Batalkan reservasi meja #' + currentTable + '? Meja akan kembali berwarna normal (tersedia).')) {
        delete bookings[currentTable];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
        refreshVisuals();
        recalcTotals();
        closeModal();
      }
    }

    function refreshVisuals() {
      document.querySelectorAll('.tbl-node').forEach(node => {
        const id = node.id.replace('tbl-', '');
        if (bookings[id]) {
          node.classList.remove('is-avail');
          node.classList.add('is-booked');
        } else {
          node.classList.remove('is-booked');
          node.classList.add('is-avail');
        }
      });
    }

    function recalcTotals() {
      const keys = Object.keys(bookings);
      document.getElementById('txtBooked').innerText = keys.length;
      let total = 0;
      keys.forEach(k => {
        total += (bookings[k].dp || 0);
      });
      document.getElementById('txtTotalDP').innerText = 'Rp ' + total.toLocaleString('id-ID');
    }

    function downloadCSVReport() {
      const keys = Object.keys(bookings);
      if (keys.length === 0) {
        alert('Belum ada data pemesanan yang tersimpan.');
        return;
      }
      let csv = 'Nomor Meja,Nama Tamu,WhatsApp,Pax,Nominal DP (IDR),Jam Tiba,Catatan\n';
      keys.forEach(k => {
        const b = bookings[k];
        csv += `"${k}","${b.name}","${b.phone}","${b.pax}","${b.dp}","${b.time}","${b.notes || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Laporan_Reservasi_Infinity_Halloween_2026.csv';
      a.click();
    }

    // 3D Controls & Gestures
    function adjustPerspective(deg) {
      rotX = Math.max(0, Math.min(50, rotX + deg));
      updateSceneTransform();
    }

    function scaleScene(delta) {
      currentScale = Math.max(0.6, Math.min(1.8, currentScale + delta));
      updateSceneTransform();
    }

    function resetScene() {
      rotX = 24;
      currentScale = 0.95;
      updateSceneTransform();
    }

    function updateSceneTransform() {
      const scene = document.getElementById('sceneContainer');
      scene.style.transform = `rotateX(${rotX}deg) scale(${currentScale})`;
    }

    // Mobile Pinch & Drag handler
    function initTouchGestures() {
      const area = document.getElementById('viewportTouchArea');
      let startDist = 0;

      area.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          startDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
        }
      }, { passive: true });

      area.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          if (startDist > 0) {
            const diff = dist - startDist;
            if (Math.abs(diff) > 10) {
              scaleScene(diff > 0 ? 0.03 : -0.03);
              startDist = dist;
            }
          }
        }
      }, { passive: true });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Infinity Sky Lounge 3D - Platinum Hotel Balikpapan</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Background Slate & Navy Eksklusif (Bukan Hitam Polos) */
      --bg-page: radial-gradient(circle at 50% 15%, #243046 0%, #172030 55%, #0f1522 100%);
      --gold-primary: #d4af37;
      --gold-light: #fef08a;
      --gold-grad: linear-gradient(135deg, #fce08a 0%, #d4af37 50%, #856108 100%);
      --floor-color: #1e2736;
      --upper-deck: #2a364a;
      --line-border: #475569;
      
      /* Merah Booking 3D Menyala */
      --red-main: #ef4444;
      --red-dark: #991b1b;
      --red-deep: #7f1d1d;
      --red-glow: rgba(239, 68, 68, 0.75);

      --card-bg: rgba(26, 35, 51, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-page);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER HOTEL MEWAH */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      padding: 10px 18px;
      position: sticky;
      top: 0;
      z-index: 60;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .hdr-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-frame {
      width: 56px;
      height: 56px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--gold-primary);
      border-radius: 10px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
      position: relative;
    }

    .brand-logo-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .brand-logo-fallback {
      display: none;
      color: var(--gold-primary);
      font-size: 1.4rem;
    }

    .brand-title h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .brand-title p {
      font-size: 0.72rem;
      color: #94a3b8;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-event {
      background: rgba(236, 72, 153, 0.2);
      border: 1px solid #ec4899;
      color: #f472b6;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 0.65rem;
      font-weight: 700;
    }

    /* STATISTIK HEADER */
    .hdr-metrics {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .metric-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .metric-card i { font-size: 0.95rem; }
    .metric-card .txt-wrap { display: flex; flex-direction: column; line-height: 1.1; }
    .metric-card .txt-wrap span { font-size: 0.62rem; color: #94a3b8; text-transform: uppercase; }
    .metric-card .txt-wrap strong { font-size: 0.82rem; }

    .btn-action-gold {
      background: var(--gold-grad);
      color: #111;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.35);
    }

    /* TOOLBAR ZOOM / NAVIGASI HP */
    .toolbar-bar {
      max-width: 1600px;
      margin: 8px auto 0;
      padding: 0 16px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .legend-tag {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.65);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.72rem;
    }

    .dot-node { width: 10px; height: 10px; border-radius: 50%; }
    .dot-node.avail { background: #38bdf8; box-shadow: 0 0 6px #38bdf8; }
    .dot-node.booked { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

    .zoom-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-tool {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #fff;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* VIEWPORT DENAH */
    .viewport-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: pan-x pan-y;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .map-frame {
      width: 100%;
      max-width: 1300px;
      transform-origin: center center;
      transition: transform 0.15s ease-out;
    }

    svg.lounge-map {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.5));
    }

    /* INTERAKTIVITAS MEJA 3D */
    .table-3d-node {
      cursor: pointer;
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .table-3d-node:hover {
      filter: drop-shadow(0 0 10px rgba(254, 240, 138, 0.8));
    }

    /* STATUS TERSEDIA (3D REALISTIK ELEGAN) */
    .table-3d-node.is-avail .sofa-cushion { fill: url(#gradSofaAvail); stroke: #475569; stroke-width: 1; }
    .table-3d-node.is-avail .sofa-table { fill: url(#gradTableAvail); stroke: #38bdf8; stroke-width: 1.5; }
    .table-3d-node.is-avail .cocktail-cloth { fill: url(#gradCocktailAvail); stroke: #64748b; stroke-width: 1; }
    .table-3d-node.is-avail .cocktail-rim { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; }
    .table-3d-node.is-avail .lbl-num { fill: #ffffff; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    /* STATUS TERBOOKING -> MERAH 3D CRIMSON MENYALA DI SEMUA ELEMEN KURSI & SOFA */
    .table-3d-node.is-booked .sofa-cushion {
      fill: url(#gradSofaBooked) !important;
      stroke: var(--red-main) !important;
      stroke-width: 1.5 !important;
      filter: drop-shadow(0 0 6px var(--red-glow));
    }
    .table-3d-node.is-booked .sofa-table {
      fill: #7f1d1d !important;
      stroke: #f87171 !important;
      stroke-width: 2 !important;
      filter: drop-shadow(0 0 8px var(--red-glow));
    }
    .table-3d-node.is-booked .cocktail-cloth {
      fill: url(#gradCocktailBooked) !important;
      stroke: var(--red-main) !important;
      stroke-width: 1.5 !important;
      filter: drop-shadow(0 0 6px var(--red-glow));
    }
    .table-3d-node.is-booked .cocktail-rim {
      fill: #991b1b !important;
      stroke: #ff7676 !important;
      stroke-width: 2 !important;
    }
    .table-3d-node.is-booked .lbl-num {
      fill: #ffffff !important;
      font-weight: 800 !important;
      text-shadow: 0 0 6px rgba(0,0,0,0.9);
    }

    /* MODAL FORM RESERVASI DENGAN INPUT DP RUPIAH MANUAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 23, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-container {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      background: linear-gradient(135deg, #243044 0%, #151e2c 100%);
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--gold-light);
    }

    .btn-x {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-row label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inp-field {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      -webkit-appearance: none;
    }

    .inp-field:focus {
      border-color: var(--gold-primary);
    }

    .money-input-box {
      position: relative;
    }

    .money-input-box span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .money-input-box input {
      padding-left: 42px;
      width: 100%;
    }

    .modal-footer {
      padding: 12px 16px;
      background: #0f172a;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-del {
      background: #7f1d1d;
      color: #fca5a5;
      border: none;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-save {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <!-- HEADER MEWAH -->
  <header>
    <div class="hdr-inner">
      <div class="brand-box">
        <div class="brand-logo-frame">
          <img id="hotelLogo" src="logo.png" alt="Logo Platinum Hotel"
               onerror="this.onerror=null; this.src='logo platinum hotel Balikpapan.png'; this.addEventListener('error', () => { this.style.display='none'; document.getElementById('logoIcon').style.display='block'; });">
          <i id="logoIcon" class="fa-solid fa-crown brand-logo-fallback"></i>
        </div>
        <div class="brand-title">
          <h1>Platinum Hotel & Convention Hall</h1>
          <p>
            <span>INFINITY SKY LOUNGE</span>
            <span class="badge-event"><i class="fa-solid fa-ghost"></i> HALLOWEEN 30 OCT 2026</span>
          </p>
        </div>
      </div>

      <div class="hdr-metrics">
        <div class="metric-card">
          <i class="fa-solid fa-couch" style="color: var(--gold-primary);"></i>
          <div class="txt-wrap">
            <span>Status</span>
            <strong><span id="statBookedCount" style="color: #ef4444;">0</span> / <span id="statTotalCount">35</span> Terisi</strong>
          </div>
        </div>

        <div class="metric-card">
          <i class="fa-solid fa-money-bill-wave" style="color: #34d399;"></i>
          <div class="txt-wrap">
            <span>Total DP</span>
            <strong id="statDPTotal" style="color: #34d399;">Rp 0</strong>
          </div>
        </div>

        <button class="btn-action-gold" onclick="exportReservationsCSV()">
          <i class="fa-solid fa-file-csv"></i> Unduh CSV
        </button>
      </div>
    </div>
  </header>

  <!-- CONTROLS & LEGENDA -->
  <div class="toolbar-bar">
    <div class="legend-tag">
      <div style="display:flex; align-items:center; gap:6px;"><div class="dot-node avail"></div> Tersedia</div>
      <div style="display:flex; align-items:center; gap:6px;"><div class="dot-node booked"></div> Terbooking (Merah)</div>
    </div>
    <div class="zoom-group">
      <button class="btn-tool" onclick="zoomMap(0.1)"><i class="fa-solid fa-plus"></i></button>
      <button class="btn-tool" onclick="zoomMap(-0.1)"><i class="fa-solid fa-minus"></i></button>
      <button class="btn-tool" onclick="resetZoom()"><i class="fa-solid fa-arrows-rotate"></i></button>
    </div>
  </div>

  <!-- VIEWPORT DENAH ARSITEKTURAL PRESISI -->
  <main class="viewport-area" id="mapTouchArea">
    <div class="map-frame" id="mapFrame">
      <svg class="lounge-map" viewBox="0 0 1200 1150" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradien 3D Sofa Tersedia -->
          <linearGradient id="gradSofaAvail" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="50%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
          </linearGradient>

          <!-- Gradien Meja Kaca Tengah Tersedia -->
          <linearGradient id="gradTableAvail" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#090d16" />
          </linearGradient>

          <!-- Gradien 3D Kain Cocktail Table Tersedia -->
          <linearGradient id="gradCocktailAvail" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#64748b" />
            <stop offset="40%" stop-color="#334155" />
            <stop offset="70%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#475569" />
          </linearGradient>

          <!-- Gradien 3D Sofa Terbooking (Merah Menyala Realistis) -->
          <linearGradient id="gradSofaBooked" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f87171" />
            <stop offset="40%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#7f1d1d" />
          </linearGradient>

          <!-- Gradien 3D Kain Cocktail Terbooking -->
          <linearGradient id="gradCocktailBooked" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f87171" />
            <stop offset="50%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#7f1d1d" />
          </linearGradient>

          <!-- Drop Shadow 3D -->
          <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
          </filter>
        </defs>

        <!-- ================= GARIS BATAS RUANGAN DENAH ASLI ================= -->
        <!-- Area Lantai Utama -->
        <polygon points="40,240 500,240 500,40 1160,40 1160,550 630,550 630,1110 40,1110" 
                 fill="var(--floor-color)" stroke="var(--line-border)" stroke-width="2.5" />

        <!-- UPPER LEVEL (SKY FLOOR ATAS) -->
        <rect x="520" y="55" width="620" height="240" fill="var(--upper-deck)" rx="6" stroke="var(--line-border)" stroke-width="1.8" />
        
        <!-- Akses Tangga & Photobox -->
        <rect x="990" y="65" width="40" height="150" fill="#334155" stroke="var(--line-border)" />
        <line x1="990" y1="85" x2="1030" y2="85" stroke="#94a3b8" stroke-width="2" />
        <line x1="990" y1="105" x2="1030" y2="105" stroke="#94a3b8" stroke-width="2" />
        <line x1="990" y1="125" x2="1030" y2="125" stroke="#94a3b8" stroke-width="2" />
        <line x1="990" y1="145" x2="1030" y2="145" stroke="#94a3b8" stroke-width="2" />
        <line x1="990" y1="165" x2="1030" y2="165" stroke="#94a3b8" stroke-width="2" />
        <line x1="990" y1="185" x2="1030" y2="185" stroke="#94a3b8" stroke-width="2" />

        <text x="1050" y="98" fill="#cbd5e1" font-size="14" font-weight="700" font-style="italic">Sky Floor</text>
        <rect x="1045" y="150" width="95" height="48" fill="#ec4899" rx="4" filter="url(#shadow3D)" />
        <text x="1092" y="178" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">photobox</text>

        <!-- Akses Lift & Rooftop Terrace -->
        <text x="540" y="222" fill="#38bdf8" font-size="11" font-weight="700">IN | OUT</text>
        <text x="520" y="238" fill="#94a3b8" font-size="9">LIFT ACCES FROM 10TH FLOOR</text>

        <rect x="655" y="208" width="58" height="26" fill="#1e293b" stroke="var(--line-border)" rx="2" />
        <text x="684" y="224" fill="#cbd5e1" font-size="8" font-weight="700" text-anchor="middle">RESTROOM</text>

        <text x="1045" y="222" fill="#38bdf8" font-size="11" font-weight="700">IN | OUT</text>
        <text x="1030" y="238" fill="#94a3b8" font-size="9">ACCES FROM ROOFTOP TERACE</text>

        <!-- PANGGUNG DJ LENGKAP RIG LIGHTING -->
        <g id="djStage" transform="translate(180, 260)" filter="url(#shadow3D)">
          <rect x="-80" y="0" width="200" height="125" fill="#1e293b" stroke="#64748b" stroke-width="2" rx="6" />
          <rect x="-40" y="75" width="120" height="42" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="3" />
          <circle cx="20" cy="55" r="14" fill="#f59e0b" filter="url(#shadow3D)" />
          <text x="20" y="102" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle">DJ BOOTH</text>

          <!-- Rig Lighting Kiri & Kanan -->
          <circle cx="-135" cy="50" r="18" fill="#0f172a" stroke="#d4af37" stroke-width="2"/>
          <line x1="-135" y1="68" x2="-160" y2="135" stroke="#d4af37" stroke-width="2" />
          <line x1="-135" y1="68" x2="-110" y2="135" stroke="#d4af37" stroke-width="2" />
          <circle cx="175" cy="50" r="18" fill="#0f172a" stroke="#d4af37" stroke-width="2"/>
          <line x1="175" y1="68" x2="150" y2="135" stroke="#d4af37" stroke-width="2" />
          <line x1="175" y1="68" x2="200" y2="135" stroke="#d4af37" stroke-width="2" />
        </g>

        <!-- BAR STATION -->
        <g id="barStation" transform="translate(535, 450)" filter="url(#shadow3D)">
          <rect x="0" y="0" width="85" height="18" fill="#ec4899" rx="3" />
          <rect x="0" y="18" width="85" height="125" fill="#8b5cf6" rx="4" />
          <text x="42" y="85" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">BAR STATION</text>
        </g>

        <!-- TEKS ELEGAN LANTAI SESUAI GAMBAR -->
        <g transform="translate(650, 560)">
          <text x="0" y="30" fill="#f1f5f9" font-family="'Cinzel', serif" font-size="28" font-weight="800" letter-spacing="2">INFINITY</text>
          <text x="0" y="65" fill="#f1f5f9" font-family="'Cinzel', serif" font-size="28" font-weight="800" letter-spacing="2">SKY LOUNGE</text>
          <text x="12" y="210" fill="#e2e8f0" font-size="24" font-weight="600">Layout HALLOWEN</text>
          <text x="12" y="245" fill="#cbd5e1" font-size="24" font-weight="500">30 October 2026</text>
        </g>

        <!-- ================= MEJA 3D REALISTIK SESUAI POSISI DENAH ================= -->

        <!-- 1. DINING TABLE 8-KURSI (SKY FLOOR ATAS): 123, 122, 121, 120 -->
        <g id="node-123" class="table-3d-node is-avail" onclick="openBooking('123', 'Dining Table 8-Pax', 8)" transform="translate(585, 68)" filter="url(#shadow3D)">
          <!-- 8 Kursi berbusa realistis -->
          <rect class="sofa-cushion" x="-10" y="8" width="9" height="14" rx="3" /><rect class="sofa-cushion" x="-10" y="32" width="9" height="14" rx="3" />

        <g id="node-151" class="table-3d-node is-avail" onclick="openBooking('151', 'Cocktail Table', 4)" transform="translate(365, 715)" filter="url(#shadow3D)"><polygon class="cocktail-cloth" points="-15,-5 -20,20 20,20 15,-5" /><circle class="cocktail-rim" cx="0" cy="-6" r="16" /><text class="lbl-num" x="0" y="-1" font-size="10" text-anchor="middle">151</text></g>

        <g id="node-153" class="table-3d-node is-avail" onclick="openBooking('153', 'Cocktail Table', 4)" transform="translate(265, 845)" filter="url(#shadow3D)"><polygon class="cocktail-cloth" points="-15,-5 -20,20 20,20 15,-5" /><circle class="cocktail-rim" cx="0" cy="-6" r="16" /><text class="lbl-num" x="0" y="-1" font-size="10" text-anchor="middle">153</text></g>
        <g id="node-152" class="table-3d-node is-avail" onclick="openBooking('152', 'Cocktail Table', 4)" transform="translate(365, 825)" filter="url(#shadow3D)"><polygon class="cocktail-cloth" points="-15,-5 -20,20 20,20 15,-5" /><circle class="cocktail-rim" cx="0" cy="-6" r="16" /><text class="lbl-num" x="0" y="-1" font-size="10" text-anchor="middle">152</text></g>

  </main>

  <!-- MODAL FORM POPUP RESERVASI & DP RUPIAH -->
  <div id="bookingModal" class="modal-backdrop">
    <div class="modal-container">
      <div class="modal-header">
        <h3><i class="fa-solid fa-chair" style="color: var(--gold-light);"></i> Reservasi <span id="modalTitle">#101</span></h3>
        <button class="btn-x" onclick="closeBookingModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body">
        <div class="form-row">
          <label><i class="fa-solid fa-user"></i> Nama Tamu (Guest Name) *</label>
          <input type="text" id="guestName" class="inp-field" placeholder="Contoh: Jessica Alexandra">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-row">
            <label><i class="fa-brands fa-whatsapp"></i> WhatsApp / HP *</label>
            <input type="tel" id="guestPhone" class="inp-field" placeholder="0812-xxxx-xxxx">
          </div>
          <div class="form-row">
            <label><i class="fa-solid fa-users"></i> Jumlah Pax</label>
            <input type="number" id="guestPax" class="inp-field" value="6" min="1">
          </div>
        </div>

        <!-- INPUT NOMINAL DP RUPIAH SECARA MANUAL -->
        <div class="form-row">
          <label><i class="fa-solid fa-money-bill-wave" style="color: #34d399;"></i> Nominal DP / Uang Muka (Manual) *</label>
          <div class="money-input-box">
            <span>Rp</span>
            <input type="text" id="guestDP" class="inp-field" placeholder="Contoh: 500.000" onkeyup="formatCurrencyInput(this)">
          </div>
        </div>

        <div class="form-row">
          <label><i class="fa-solid fa-clock"></i> Jam Kedatangan</label>
          <select id="guestTime" class="inp-field">
            <option value="20:00 WITA">20:00 WITA (Gate Opening)</option>
            <option value="21:00 WITA" selected>21:00 WITA (Main DJ Set)</option>
            <option value="22:00 WITA">22:00 WITA (Midnight Bash)</option>
          </select>
        </div>

        <div class="form-row">
          <label><i class="fa-solid fa-note-sticky"></i> Catatan Khusus / Special Request</label>
          <input type="text" id="guestNotes" class="inp-field" placeholder="Cth: Request bucket ice & glasses...">
        </div>
      </div>

      <div class="modal-footer">
        <button id="btnRemoveBooking" class="btn-del" onclick="deleteBooking()" style="display: none;">
          <i class="fa-solid fa-trash"></i> Hapus Reservasi
        </button>
        <button class="btn-del" style="background:#334155; color:#cbd5e1;" onclick="closeBookingModal()">Tutup</button>
        <button class="btn-save" onclick="saveBooking()">
          <i class="fa-solid fa-check"></i> Simpan (Ubah ke Merah)
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'infinity_halloween_2026_bookings';
    let bookings = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    let currentTable = null;
    let zoomLevel = 1.0;

    window.addEventListener('DOMContentLoaded', () => {
      refreshMapNodes();
      updateMetrics();
      initGestures();
    });

    function openBooking(tableId, tableType, defaultPax) {
      currentTable = tableId;
      document.getElementById('modalTitle').innerText = '#' + tableId + ' (' + tableType + ')';

      const data = bookings[tableId];
      const btnDel = document.getElementById('btnRemoveBooking');

      if (data) {
        document.getElementById('guestName').value = data.name || '';
        document.getElementById('guestPhone').value = data.phone || '';
        document.getElementById('guestPax').value = data.pax || defaultPax;
        document.getElementById('guestDP').value = data.dp ? parseInt(data.dp, 10).toLocaleString('id-ID') : '';
        document.getElementById('guestTime').value = data.time || '21:00 WITA';
        document.getElementById('guestNotes').value = data.notes || '';
        btnDel.style.display = 'inline-flex';
      } else {
        document.getElementById('guestName').value = '';
        document.getElementById('guestPhone').value = '';
        document.getElementById('guestPax').value = defaultPax;
        document.getElementById('guestDP').value = '';
        document.getElementById('guestTime').value = '21:00 WITA';
        document.getElementById('guestNotes').value = '';
        btnDel.style.display = 'none';
      }

      document.getElementById('bookingModal').classList.add('open');
    }

    function closeBookingModal() {
      document.getElementById('bookingModal').classList.remove('open');
      currentTable = null;
    }

    function formatCurrencyInput(el) {
      let val = el.value.replace(/[^0-9]/g, '');
      el.value = val ? parseInt(val, 10).toLocaleString('id-ID') : '';
    }

    function saveBooking() {
      const name = document.getElementById('guestName').value.trim();
      const phone = document.getElementById('guestPhone').value.trim();
      const rawDP = document.getElementById('guestDP').value.replace(/[^0-9]/g, '');

      if (!name) {
        alert('Silakan masukkan nama tamu pemesan.');
        return;
      }

      bookings[currentTable] = {
        name: name,
        phone: phone,
        pax: document.getElementById('guestPax').value,
        dp: rawDP ? parseInt(rawDP, 10) : 0,
        time: document.getElementById('guestTime').value,
        notes: document.getElementById('guestNotes').value,
        timestamp: new Date().toISOString()
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
      refreshMapNodes();
      updateMetrics();
      closeBookingModal();
    }

    function deleteBooking() {
      if (confirm('Batalkan reservasi meja #' + currentTable + '? Meja akan kembali berwarna normal (tersedia).')) {
        delete bookings[currentTable];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
        refreshMapNodes();
        updateMetrics();
        closeBookingModal();
      }
    }

    function refreshMapNodes() {
      document.querySelectorAll('.table-3d-node').forEach(node => {
        const id = node.id.replace('node-', '');
        if (bookings[id]) {
          node.classList.remove('is-avail');
          node.classList.add('is-booked');
        } else {
          node.classList.remove('is-booked');
          node.classList.add('is-avail');
        }
      });
    }

    function updateMetrics() {
      const keys = Object.keys(bookings);
      document.getElementById('statBookedCount').innerText = keys.length;
      let total = 0;
      keys.forEach(k => {
        total += (bookings[k].dp || 0);
      });
      document.getElementById('statDPTotal').innerText = 'Rp ' + total.toLocaleString('id-ID');
    }

    function exportReservationsCSV() {
      const keys = Object.keys(bookings);
      if (keys.length === 0) {
        alert('Belum ada data reservasi yang terisi.');
        return;
      }

      let csv = 'Nomor Meja,Nama Pemesan,WhatsApp,Pax,Nominal DP (IDR),Jam Tiba,Catatan\n';
      keys.forEach(k => {
        const b = bookings[k];
        csv += `"${k}","${b.name}","${b.phone}","${b.pax}","${b.dp}","${b.time}","${b.notes || ''}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Reservasi_Infinity_Halloween_2026.csv';
      a.click();
    }

    // Zoom & Pan untuk Android / iOS
    function zoomMap(delta) {
      zoomLevel = Math.max(0.6, Math.min(2.0, zoomLevel + delta));
      applyTransform();
    }

    function resetZoom() {
      zoomLevel = 1.0;
      applyTransform();
    }

    function applyTransform() {
      document.getElementById('mapFrame').style.transform = `scale(${zoomLevel})`;
    }

    function initGestures() {
      const area = document.getElementById('mapTouchArea');
      let startDist = 0;

      area.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          startDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
        }
      }, { passive: true });

      area.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          if (startDist > 0) {
            const diff = dist - startDist;
            if (Math.abs(diff) > 12) {
              zoomMap(diff > 0 ? 0.03 : -0.03);
              startDist = dist;
            }
          }
        }
      }, { passive: true });
    }
  </script>
</body>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Infinity Sky Lounge - Spooky Night At The Sky 2026</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Library html2canvas & jsPDF untuk Ekspor PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-page: #080c14;
      --gold-primary: #d4af37;
      --gold-grad: linear-gradient(135deg, #fce08a 0%, #d4af37 50%, #856108 100%);
      --red-booked: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.95);
      --card-bg: rgba(18, 24, 38, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-page);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: rgba(13, 19, 31, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      padding: 10px 18px;
      position: sticky;
      top: 0;
      z-index: 60;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .hdr-wrap {
      max-width: 1650px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-frame {
      min-width: 95px;
      height: 48px;
      background: #ffffff;
      border: 1.5px solid var(--gold-primary);
      border-radius: 8px;
      padding: 2px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
    }

    .brand-logo-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .brand-text h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.72rem;
      color: #94a3b8;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .event-badge {
      background: rgba(236, 72, 153, 0.2);
      border: 1px solid #ec4899;
      color: #f472b6;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 0.65rem;
      font-weight: 700;
    }

    /* METRIK & TOMBOL AKSI */
    .hdr-metrics {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill i { font-size: 0.95rem; }
    .stat-pill .txt-wrap { display: flex; flex-direction: column; line-height: 1.1; }
    .stat-pill .txt-wrap span { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; }
    .stat-pill .txt-wrap strong { font-size: 0.82rem; }

    /* TOMBOL PDF SPESIAL */
    .btn-pdf {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      border: 1px solid #f87171;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
      transition: all 0.2s ease;
    }

    .btn-pdf:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.6);
    }

    .btn-action-gold {
      background: var(--gold-grad);
      color: #111;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.76rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.35);
    }

    /* TOOLBAR CONTROLS */
    .toolbar-bar {
      max-width: 1650px;
      margin: 8px auto 0;
      padding: 0 16px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .legend-tag {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.75);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.72rem;
    }

    .dot-node { width: 10px; height: 10px; border-radius: 50%; }
    .dot-node.avail { background: #38bdf8; box-shadow: 0 0 6px #38bdf8; }
    .dot-node.booked { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

    .zoom-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-tool-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #fff;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* VIEWPORT DENAH */
    .viewport-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: pan-x pan-y;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .map-frame {
      width: 100%;
      max-width: 1180px;
      position: relative;
      transform-origin: center center;
      transition: transform 0.15s ease-out;
      box-shadow: 0 25px 50px rgba(0,0,0,0.85);
      border-radius: 12px;
      overflow: hidden;
    }

    .render-3d-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* HOTSPOTS INTERAKTIF */
    .hotspots-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    .spot {
      position: absolute;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: transform 0.2s ease, background 0.2s ease;
      background: rgba(56, 189, 248, 0.1);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
    }

    .spot:hover {
      background: rgba(254, 240, 138, 0.3);
      border-color: #fef08a;
      box-shadow: 0 0 12px rgba(254, 240, 138, 0.7);
      transform: scale(1.05);
      z-index: 10;
    }

    .spot.round {
      border-radius: 50%;
    }

    /* STATUS TERBOOKING -> MERAH MENYALA */
    .spot.is-booked {
      background: rgba(220, 38, 38, 0.78) !important;
      border: 2px solid #ff4d4d !important;
      box-shadow: 0 0 16px var(--red-glow), inset 0 0 8px rgba(255,255,255,0.5) !important;
      z-index: 5;
    }

    /* MODAL POPUP FORM */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 20, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-container {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8);
    }

    .modal-header {
      background: linear-gradient(135deg, #1f2a3c 0%, #121926 100%);
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: #fef08a;
    }

    .btn-x {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-row label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inp-field {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      -webkit-appearance: none;
    }

    .inp-field:focus {
      border-color: var(--gold-primary);
    }

    .money-input-box {
      position: relative;
    }

    .money-input-box span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .money-input-box input {
      padding-left: 42px;
      width: 100%;
    }

    .modal-footer {
      padding: 12px 16px;
      background: #0f172a;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-del {
      background: #7f1d1d;
      color: #fca5a5;
      border: none;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-save {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
    }

    /* LOADING SPINNER KETIKA GENERATE PDF */
    .pdf-loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .pdf-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(212, 175, 55, 0.2);
      border-top-color: var(--gold-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

        <div id="spot-155" class="spot round" style="top: 78.5%; left: 9.5%; width: 6.2%; height: 7.2%;" onclick="openBooking('155', 'Cocktail Table', 4)"></div>
        <div id="spot-153" class="spot round" style="top: 79.2%; left: 19.2%; width: 6.2%; height: 7.2%;" onclick="openBooking('153', 'Cocktail Table', 4)"></div>
        <div id="spot-152" class="spot round" style="top: 77.8%; left: 28.8%; width: 6.2%; height: 7.2%;" onclick="openBooking('152', 'Cocktail Table', 4)"></div>

      </div>
    </div>
  </main>

  <!-- MODAL RESERVASI & DP RUPIAH MANUAL -->
  <div id="bookingModal" class="modal-backdrop">
    <div class="modal-container">
      <div class="modal-header">
        <h3><i class="fa-solid fa-chair" style="color: #fef08a;"></i> Reservasi Meja <span id="modalTitle">#101</span></h3>
        <button class="btn-x" onclick="closeBookingModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body">
        <div class="form-row">
          <label><i class="fa-solid fa-user"></i> Nama Tamu (Guest Name) *</label>
          <input type="text" id="guestName" class="inp-field" placeholder="Contoh: Jessica Alexandra">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-row">
            <label><i class="fa-brands fa-whatsapp"></i> WhatsApp / HP *</label>
            <input type="tel" id="guestPhone" class="inp-field" placeholder="0812-xxxx-xxxx">
          </div>
          <div class="form-row">
            <label><i class="fa-solid fa-users"></i> Jumlah Pax</label>
            <input type="number" id="guestPax" class="inp-field" value="4" min="1">
          </div>
        </div>

        <!-- INPUT NOMINAL DP RUPIAH SECARA MANUAL -->
        <div class="form-row">
          <label><i class="fa-solid fa-money-bill-wave" style="color: #34d399;"></i> Nominal DP / Uang Muka (Manual) *</label>
          <div class="money-input-box">
            <span>Rp</span>
            <input type="text" id="guestDP" class="inp-field" placeholder="Contoh: 500.000" onkeyup="formatCurrencyInput(this)">
          </div>
        </div>

        <div class="form-row">
          <label><i class="fa-solid fa-clock"></i> Jam Kedatangan</label>
          <select id="guestTime" class="inp-field">
            <option value="20:00 WITA">20:00 WITA (Gate Opening)</option>
            <option value="21:00 WITA" selected>21:00 WITA (Main DJ Set)</option>
            <option value="22:00 WITA">22:00 WITA (Midnight Bash)</option>
          </select>
        </div>

        <div class="form-row">
          <label><i class="fa-solid fa-note-sticky"></i> Catatan Khusus / Special Request</label>
          <input type="text" id="guestNotes" class="inp-field" placeholder="Cth: Request bucket ice, fruit platter...">
        </div>
      </div>

      <div class="modal-footer">
        <button id="btnRemoveBooking" class="btn-del" onclick="deleteBooking()" style="display: none;">
          <i class="fa-solid fa-trash"></i> Hapus Reservasi
        </button>
        <button class="btn-del" style="background:#334155; color:#cbd5e1;" onclick="closeBookingModal()">Tutup</button>
        <button class="btn-save" onclick="saveBooking()">
          <i class="fa-solid fa-check"></i> Simpan (Ubah ke Merah)
        </button>
      </div>
    </div>
  </div>

  <!-- LOADING OVERLAY GENERATE PDF -->
  <div id="pdfLoading" class="pdf-loading-overlay">
    <div class="pdf-spinner"></div>
    <div style="color: var(--gold-primary); font-weight: 700; font-size: 0.95rem;">Sedang Membuat File PDF Denah Terkini...</div>
    <div style="color: #cbd5e1; font-size: 0.8rem;">Mohon tunggu sejenak</div>
  </div>

  <script>
    const STORAGE_KEY = 'infinity_halloween_2026_bookings';
    let bookings = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    let currentTable = null;
    let zoomLevel = 1.0;

    window.addEventListener('DOMContentLoaded', () => {
      refreshMapNodes();
      updateMetrics();
      initGestures();
    });

    function openBooking(tableId, tableType, defaultPax) {
      currentTable = tableId;
      document.getElementById('modalTitle').innerText = '#' + tableId + ' (' + tableType + ')';

      const data = bookings[tableId];
      const btnDel = document.getElementById('btnRemoveBooking');

      if (data) {
        document.getElementById('guestName').value = data.name || '';
        document.getElementById('guestPhone').value = data.phone || '';
        document.getElementById('guestPax').value = data.pax || defaultPax;
        document.getElementById('guestDP').value = data.dp ? parseInt(data.dp, 10).toLocaleString('id-ID') : '';
        document.getElementById('guestTime').value = data.time || '21:00 WITA';
        document.getElementById('guestNotes').value = data.notes || '';
        btnDel.style.display = 'inline-flex';
      } else {
        document.getElementById('guestName').value = '';
        document.getElementById('guestPhone').value = '';
        document.getElementById('guestPax').value = defaultPax;
        document.getElementById('guestDP').value = '';
        document.getElementById('guestTime').value = '21:00 WITA';
        document.getElementById('guestNotes').value = '';
        btnDel.style.display = 'none';
      }

      document.getElementById('bookingModal').classList.add('open');
    }

    function closeBookingModal() {
      document.getElementById('bookingModal').classList.remove('open');
      currentTable = null;
    }

    function formatCurrencyInput(el) {
      let val = el.value.replace(/[^0-9]/g, '');
      el.value = val ? parseInt(val, 10).toLocaleString('id-ID') : '';
    }

    function saveBooking() {
      const name = document.getElementById('guestName').value.trim();
      const phone = document.getElementById('guestPhone').value.trim();
      const rawDP = document.getElementById('guestDP').value.replace(/[^0-9]/g, '');

      if (!name) {
        alert('Silakan masukkan nama tamu pemesan.');
        return;
      }

      bookings[currentTable] = {
        name: name,
        phone: phone,
        pax: document.getElementById('guestPax').value,
        dp: rawDP ? parseInt(rawDP, 10) : 0,
        time: document.getElementById('guestTime').value,
        notes: document.getElementById('guestNotes').value,
        timestamp: new Date().toISOString()
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
      refreshMapNodes();
      updateMetrics();
      closeBookingModal();
    }

    function deleteBooking() {
      if (confirm('Batalkan reservasi meja #' + currentTable + '? Meja akan kembali berwarna normal (tersedia).')) {
        delete bookings[currentTable];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
        refreshMapNodes();
        updateMetrics();
        closeBookingModal();
      }
    }

    function refreshMapNodes() {
      document.querySelectorAll('.spot').forEach(spot => {
        const id = spot.id.replace('spot-', '');
        if (bookings[id]) {
          spot.classList.add('is-booked');
        } else {
          spot.classList.remove('is-booked');
        }
      });
    }

    function updateMetrics() {
      const keys = Object.keys(bookings);
      document.getElementById('statBookedCount').innerText = keys.length;
      let total = 0;
      keys.forEach(k => {
        total += (bookings[k].dp || 0);
      });
      document.getElementById('statDPTotal').innerText = 'Rp ' + total.toLocaleString('id-ID');
    }

    // ================= FITUR GENERATE PDF UPDATE DENAH =================
    async function generateLayoutPDF() {
      const loading = document.getElementById('pdfLoading');
      loading.style.display = 'flex';

      // Reset zoom sementara agar hasil tangkapan PDF berkualitas tinggi & pas
      const oldTransform = document.getElementById('mapFrame').style.transform;
      document.getElementById('mapFrame').style.transform = 'scale(1)';

      try {
        const targetElement = document.getElementById('mapFrame');
        
        const canvas = await html2canvas(targetElement, {
          scale: 2, // Kualitas cetak HD
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#080c14'
        });

        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const { jsPDF } = window.jspdf;
        
        // Buat PDF Orientasi Landscape
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'mm',
          format: 'a4'
        });

        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();

        // Header Dokumen PDF
        pdf.setFillColor(13, 19, 31);
        pdf.rect(0, 0, pdfWidth, 18, 'F');
        
        pdf.setFont('helvetica', 'bold');
        pdf.setTextColor(212, 175, 55);
        pdf.setFontSize(13);
        pdf.text('PLATINUM HOTEL & CONVENTION HALL BALIKPAPAN', 10, 8);

        pdf.setFont('helvetica', 'normal');
        pdf.setTextColor(248, 250, 252);
        pdf.setFontSize(9);
        const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        pdf.text('Layout Update: Infinity Sky Lounge - Halloween 2026 | ' + dateStr, 10, 14);

        // Status Ringkasan
        const bookedNum = Object.keys(bookings).length;
        pdf.setTextColor(239, 68, 68);
        pdf.text(`Status: ${bookedNum} Meja Terbooking (Merah) | ${36 - bookedNum} Tersedia`, pdfWidth - 85, 14);

        // Render Gambar Denah di Tengah PDF
        const marginY = 20;
        const availableHeight = pdfHeight - marginY - 6;
        const imgRatio = canvas.width / canvas.height;
        let printWidth = availableHeight * imgRatio;
        let printHeight = availableHeight;

        if (printWidth > (pdfWidth - 20)) {
          printWidth = pdfWidth - 20;
          printHeight = printWidth / imgRatio;
        }

        const posX = (pdfWidth - printWidth) / 2;
        pdf.addImage(imgData, 'JPEG', posX, marginY, printWidth, printHeight);

        // Simpan File PDF
        pdf.save(`Layout_Update_InfinitySkyLounge_${new Date().toISOString().slice(0,10)}.pdf`);
      } catch (err) {
        console.error('Gagal membuat PDF otomatis:', err);
        // Fallback cetak native browser
        window.print();
      } finally {
        document.getElementById('mapFrame').style.transform = oldTransform;
        loading.style.display = 'none';
      }
    }

    function exportReservationsCSV() {
      const keys = Object.keys(bookings);
      if (keys.length === 0) {
        alert('Belum ada data reservasi yang terisi.');
        return;
      }

      let csv = 'Nomor Meja,Nama Pemesan,WhatsApp,Pax,Nominal DP (IDR),Jam Tiba,Catatan\n';
      keys.forEach(k => {
        const b = bookings[k];
        csv += `"${k}","${b.name}","${b.phone}","${b.pax}","${b.dp}","${b.time}","${b.notes || ''}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Reservasi_Infinity_Spooky_Night_2026.csv';
      a.click();
    }

    // Zoom & Gestures untuk Android & iOS
    function zoomMap(delta) {
      zoomLevel = Math.max(0.6, Math.min(2.0, zoomLevel + delta));
      applyTransform();
    }

    function resetZoom() {
      zoomLevel = 1.0;
      applyTransform();
    }

    function applyTransform() {
      document.getElementById('mapFrame').style.transform = `scale(${zoomLevel})`;
    }

    function initGestures() {
      const area = document.getElementById('mapTouchArea');
      let startDist = 0;

      area.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          startDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
        }
      }, { passive: true });

      area.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          if (startDist > 0) {
            const diff = dist - startDist;
            if (Math.abs(diff) > 12) {
              zoomMap(diff > 0 ? 0.03 : -0.03);
              startDist = dist;
            }
          }
        }
      }, { passive: true });
    }
  </script>
</body>
</html>
